[project]
name = "ap5-agentic-ai-mcp"
version = "0.1.0"
description = "Activité Pratique N°5 : LangChain, LangGraph, MCP et SAV multi-agents"
requires-python = ">=3.11,<3.13"
dependencies = [
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-community",
    "langchain-experimental",
    "langchain-ollama",
    "langchain-openai",
    "langchain-tavily",
    "langchain-mcp-adapters",
    "langchain-text-splitters",
    "langgraph>=1.0",
    "langgraph-cli[inmem]",
    "mcp[cli]>=1.9,<2",
    "ddgs",
    "chromadb",
    "open-clip-torch",
    "torch",
    "pillow",
    "pymupdf",
    "streamlit",
    "python-dotenv",
    "pydantic>=2",
]

[dependency-groups]
dev = ["ipykernel", "nbconvert", "nbformat", "pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
